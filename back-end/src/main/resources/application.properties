abacatepay.webhook-name=${ABACATEPAY_WEBHOOK_NAME:ShopBank Payments}
abacatepay.sandbox=${ABACATEPAY_SANDBOX:true}
abacatepay.api-base-url=${ABACATEPAY_API_BASE_URL:https://api.abacatepay.com/v2}
abacatepay.public-url=${APP_PUBLIC_URL:http://localhost:8080}
abacatepay.return-url=${FRONTEND_PENDING_URL:http://localhost:4200/payment/pending}
abacatepay.completion-url=${FRONTEND_SUCCESS_URL:http://localhost:4200/payment/success}
abacatepay.failure-url=${FRONTEND_FAILURE_URL:http://localhost:4200/payment/failure}
abacatepay.pix-expires-in=${ABACATEPAY_PIX_EXPIRES_IN:3600}
abacatepay.checkout-max-installments=${ABACATEPAY_CHECKOUT_MAX_INSTALLMENTS:12}

spring.activemq.broker-url=tcp://localhost:61616
