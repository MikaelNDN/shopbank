spring.application.name=shopbank

spring.datasource.url=jdbc:h2:mem:shopbank
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html

shopbank.marketplace.fee-rate=${SHOPBANK_MARKETPLACE_FEE_RATE:0.00}

abacatepay.api-key=${ABACATEPAY_API_KEY:}
abacatepay.webhook-secret=${ABACATEPAY_WEBHOOK_SECRET:}
